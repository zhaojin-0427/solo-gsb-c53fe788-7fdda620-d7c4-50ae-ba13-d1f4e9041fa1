Pet:
  type: object
  required: [id, name, status]
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
      minLength: 1
      maxLength: 50
    status:
      type: string
      enum: [available, pending, sold]
    nickname:
      type: string
      nullable: true
    tags:
      type: array
      items:
        $ref: "#/Tag"
      maxItems: 20
    category:
      allOf:
        - $ref: "#/Category"
    owner:
      $ref: "customer.yaml#/Customer"
    parent:
      $ref: "#/Pet"
    kind:
      oneOf:
        - $ref: "#/Dog"
        - $ref: "#/Cat"
    photo_urls:
      type: array
      items: { type: string }

Tag:
  type: object
  required: [name]
  properties:
    name: { type: string }
    color: { type: string, nullable: true }

Category:
  type: object
  required: [id, name]
  properties:
    id: { type: integer }
    name: { type: string }

Dog:
  allOf:
    - $ref: "#/Named"
    - type: object
      required: [breed]
      properties:
        breed: { type: string }

Cat:
  allOf:
    - $ref: "#/Named"
    - type: object
      required: [indoor]
      properties:
        indoor: { type: boolean }

Named:
  type: object
  required: [name]
  properties:
    name: { type: string }

NewPet:
  type: object
  required: [name]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 50
    nickname:
      type: string
    tags:
      type: array
      items:
        $ref: "#/Tag"
      maxItems: 20
    category:
      $ref: "#/Category"
    kind:
      oneOf:
        - $ref: "#/Dog"
        - $ref: "#/Cat"
    photo_urls:
      type: array
      items: { type: string }
