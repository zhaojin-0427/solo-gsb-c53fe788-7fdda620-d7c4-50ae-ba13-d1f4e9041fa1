services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openapi
      POSTGRES_PASSWORD: openapi
      POSTGRES_DB: openapi_contract
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openapi -d openapi_contract"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    environment:
      DATABASE_URL: postgresql://openapi:openapi@db:5432/openapi_contract
      MAX_UPLOAD_MB: "16"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
